name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Nom d'asset stable
        run: cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg Cadence.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Cadence.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis
      - name: Nom d'asset stable
        run: Copy-Item src-tauri/target/release/bundle/nsis/*.exe Cadence-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Cadence-Setup.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Cadence.dmg
            Cadence-Setup.exe
          generate_release_notes: true
          body: |
            **Cadence pour macOS** (`Cadence.dmg`, universel — Apple Silicon & Intel, macOS 12+)
            **Cadence pour Windows** (`Cadence-Setup.exe`, Windows 10/11, x64)

            App non signée : macOS et Windows demandent une autorisation au
            premier lancement — guide d'installation sur le site Cadence.
