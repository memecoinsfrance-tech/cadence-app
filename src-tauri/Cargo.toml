[package]
name = "cadence-desktop"
version = "1.2.0"
description = "Cadence — centre de contrôle personnel pour la classe préparatoire"
edition = "2021"

[lib]
name = "cadence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mise à jour automatique. Ciblée sur desktop uniquement : le plugin n'existe
# ni sur Android ni sur iOS (cette coquille ne vise que macOS + Windows, mais
# la cible conditionnelle garde le champ libre et évite une erreur si mobile
# était ajouté un jour). `check()` / `download_and_install()` sont 100 % Rust —
# aucun paquet npm requis, la page Vercel distante n'a rien à invoquer.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
