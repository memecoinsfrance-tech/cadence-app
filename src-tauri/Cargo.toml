[package]
name = "cadence-desktop"
version = "1.0.1"
description = "Cadence — centre de contrôle personnel pour la classe préparatoire"
edition = "2021"

[lib]
name = "cadence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
